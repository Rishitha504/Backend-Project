<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Delivery Agent Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <h2>Delivery Agent Login</h2>

            <form id="deliveryLoginForm">

    <label>Email</label>
    <input
        type="email"
        id="email"
        name="email"
        required
    >

    <label>Password</label>
    <input
        type="password"
        id="password"
        name="password"
        required
    >

    <button type="submit">
        Login
    </button>

        </form>

        <br>

        <p>
            Don't have a delivery agent account?
        </p>

        <a href="delivery-register.html">
            Register as Delivery Agent
        </a>

        <br><br>

        <a href="index.html">
            Back to Home
        </a>

    </div>

    <!-- Delivery Agent Login JavaScript -->
    <script src="js/delivery-login.js"></script>

</body>

</html>
