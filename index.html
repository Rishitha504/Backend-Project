<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Courier Parcel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7ff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .welcome-container {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 60px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
        }

        .logo {
            font-size: 70px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 42px;
            color: #3949db;
            margin-bottom: 15px;
        }

        .tagline {
            font-size: 18px;
            color: #666;
            margin-bottom: 40px;
        }

        .next-btn {
            display: inline-block;
            background: #3949db;
            color: white;
            padding: 15px 55px;
            border-radius: 10px;
            text-decoration: none;
            font-size: 18px;
            font-weight: bold;
            transition: 0.3s;
        }

        .next-btn:hover {
            background: #2835b8;
            transform: translateY(-2px);
        }
    </style>
</head>

<body>

    <div class="welcome-container">

        <div class="logo">📦</div>

        <h1>Courier Parcel</h1>

        <p class="tagline">
            Fast • Safe • Reliable
        </p>

        <a href="role-selection.html" class="next-btn">
            NEXT
        </a>

    </div>

</body>
</html>
