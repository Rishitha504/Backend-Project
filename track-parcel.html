<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Track Parcel</title>

    <link rel="stylesheet"
          href="css/style.css">
</head>

<body>

<div class="container">

    <h2>Track Your Parcel</h2>

    <input
        type="text"
        id="trackingNumber"
        placeholder="Enter tracking number">

    <button onclick="trackParcel()">
        Track
    </button>

    <div id="trackingResult"></div>

</div>

<script src="js/tracking.js"></script>

</body>
</html>
